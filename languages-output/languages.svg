  <!-- Python -->
  <text x="36" y="270" font-family="Arial" font-size="13" fill="#ffffff">Python</text>
  <rect x="160" y="256" width="520" height="18" rx="9" fill="#10131a" />
  <rect x="160" y="256" width="55.64" height="18" rx="9" fill="#3776ab"/>
  <text x="690" y="270" font-family="Arial" font-size="12" fill="#ffffff">10.7%</text>

</svg>
