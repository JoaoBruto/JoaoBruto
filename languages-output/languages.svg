<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">Linguagens - Distribuição</title>
  <desc id="desc">Distribuição de linguagens nos repositórios públicos de JoaoBruto (JS, CSS, HTML, TypeScript, Python).</desc>
  <rect width="100%" height="100%" fill="#0b0f1a" rx="12"/>

  <text x="36" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="22" fill="#ffffff" font-weight="600">Linguagens</text>
  <text x="36" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="12" fill="#9aa4bf">Distribuição agregada nos repositórios públicos</text>


  <!-- Bars -->
  <!-- layout settings -->
  <!-- labels at x=36, bars start x=160, max width=520 -->
  <!-- Percentagens: JS 37.9, TS 9.7, HTML 20.7, CSS 21.1, Python 10.7 -->
  <!-- Calculated widths = percent/100 * 520 -->

  <!-- JavaScript -->
  <text x="36" y="110" font-family="Arial" font-size="13" fill="#ffffff">JavaScript</text>
  <rect x="160" y="96" width="520" height="18" rx="9" fill="#10131a" />
  <rect x="160" y="96" width="197.08" height="18" rx="9" fill="#f7df1e"/>
  <text x="690" y="110" font-family="Arial" font-size="12" fill="#ffffff">37.9%</text>

  <!-- TypeScript -->
  <text x="36" y="150" font-family="Arial" font-size="13" fill="#ffffff">TypeScript</text>
  <rect x="160" y="136" width="520" height="18" rx="9" fill="#10131a" />
  <rect x="160" y="136" width="50.44" height="18" rx="9" fill="#3178c6"/>
  <text x="690" y="150" font-family="Arial" font-size="12" fill="#ffffff">9.7%</text>

  <!-- HTML -->
  <text x="36" y="190" font-family="Arial" font-size="13" fill="#ffffff">HTML</text>
  <rect x="160" y="176" width="520" height="18" rx="9" fill="#10131a" />
  <rect x="160" y="176" width="107.64" height="18" rx="9" fill="#e34c26"/>
  <text x="690" y="190" font-family="Arial" font-size="12" fill="#ffffff">20.7%</text>

  <!-- CSS -->
  <text x="36" y="230" font-family="Arial" font-size="13" fill="#ffffff">CSS</text>
  <rect x="160" y="216" width="520" height="18" rx="9" fill="#10131a" />
  <rect x="160" y="216" width="109.72" height="18" rx="9" fill="#1572b6"/>
